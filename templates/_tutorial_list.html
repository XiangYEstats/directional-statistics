<div class="tutorial-list">{% for item in tutorials %}<a class="tutorial-row" href="{{ url('tutorials/' + item.slug + '/') }}"><span class="tutorial-number">0{{ loop.index }}</span><div><span class="eyebrow">{{ item.category }} / {{ item.implementation }} IMPLEMENTATION</span><h3>{{ item.title }}</h3><p>{{ item.summary }}</p></div><span class="tutorial-arrow" aria-hidden="true">↗</span></a>{% endfor %}</div>
